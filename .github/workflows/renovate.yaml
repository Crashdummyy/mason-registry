name: Renovate
on:
  workflow_dispatch:
  schedule:
    - cron: "1 */12 * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.RW_GITHUB_TOKEN }}
      RELEASE_REPO: Crashdummyy/roslynLanguageServer
    steps:
      - name: Get vscode-csharp roslyn version
        id: vscode
        run: |
          roslyn=$(curl -fsSL https://raw.githubusercontent.com/dotnet/vscode-csharp/refs/heads/main/package.json | jq -er '.defaults.roslyn')
          echo "roslyn=$roslyn" >> "$GITHUB_OUTPUT"

      - name: Assert stable release is frozen ( prevent cleanup )
        env:
          STABLE: ${{ steps.vscode.outputs.roslyn }}
        run: |
          frozen=$(gh variable get FROZENRELEASES -R "$RELEASE_REPO")

          if [[ ";$frozen;" == *";$STABLE;"* ]]; then
            echo "$STABLE is already frozen"
          else
            gh variable set FROZENRELEASES --body "$frozen;$STABLE" -R "$RELEASE_REPO"
          fi

      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.RW_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name Crashdummyy
          git config user.email Simon.Schwendele@gmx.de
          git config http.sslVerify false

      - name: Update packages
        working-directory: packages
        env:
          STABLE: ${{ steps.vscode.outputs.roslyn }}
        run: |
          required_assets() {
            grep -oP 'file: \K[^:]+' "$1" | sort -u
          }

          release_is_complete() {
            local tag=$1 package=$2 published
            published=$(gh release view "$tag" -R "$RELEASE_REPO" --json assets -q '.assets[].name') || return 1
            [[ -z $(comm -23 <(required_assets "$package") <(sort -u <<< "$published")) ]]
          }

          set_version() {
            sed -i "s|roslynLanguageServer@.*|roslynLanguageServer@$2|" "$1"
          }

          if release_is_complete "$STABLE" roslyn/package.yaml; then
            set_version roslyn/package.yaml "$STABLE"
          else
            echo "::warning::Stable $STABLE is not (completely) released in $RELEASE_REPO yet, keeping current version"
          fi

          tags=$(gh release list -R "$RELEASE_REPO" --exclude-drafts --json tagName -q '.[].tagName')
          for tag in $(sort -Vr <<< "$tags"); do
            if release_is_complete "$tag" roslyn-nightly/package.yaml; then
              set_version roslyn-nightly/package.yaml "$tag"
              break
            fi
            echo "Skipping incomplete release $tag"
          done

      - name: Commit changes
        run: |
          if [[ $(git diff --name-only | wc -l) -gt 0 ]];then
            echo "detected changes";
            git diff --name-only

            git add "./packages"
            git commit -m "Daily updates"
            git push -u origin HEAD
          else
            echo "No updates detected. Skipping PR"
            exit 0
          fi
